<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retail Requirement Tool</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Aptos Narrow', 'Calibri', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: var(--shell-bg, #0f172a); color: var(--text-primary, #e2e8f0); transition: background 0.2s, color 0.2s; }

      /* Theme CSS variables — set by ThemeContext.tsx on :root */
      :root {
        --shell-bg: #0f172a; --sidebar-bg: #1e293b; --sidebar-border: #334155;
        --card-bg: #1e293b; --card-border: #334155; --input-bg: #0f172a;
        --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #475569;
        --accent: #38bdf8; --accent-bg: #38bdf818;
        --success: #34d399; --warning: #fbbf24; --danger: #f87171;
        --table-header-bg: #0f172a; --table-row-hover: #334155; --table-border: #334155;
      }

      /* Mobile responsive grids */
      @media (max-width: 767px) {
        /* Override inline grid styles on dashboard cards */
        [data-grid] { grid-template-columns: 1fr 1fr !important; }
        [data-grid="1"] { grid-template-columns: 1fr !important; }

        /* Tables scroll horizontally */
        table { min-width: 500px; }
        .table-wrap { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }

        /* Popups/modals full-screen on mobile */
        [data-popup] {
          left: 0 !important; top: 0 !important;
          width: 100vw !important; height: 100vh !important;
          border-radius: 0 !important;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CuE187EX.js"></script>
  </head>

    <div id="root"></div>
  </body>

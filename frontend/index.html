<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retail Requirement Tool</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }

      /* Mobile responsive grids */
      @media (max-width: 767px) {
        /* Override inline grid styles on dashboard cards */
        [data-grid] { grid-template-columns: 1fr 1fr !important; }
        [data-grid="1"] { grid-template-columns: 1fr !important; }

        /* Tables scroll horizontally */
        table { min-width: 500px; }
        .table-wrap { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }

        /* Popups/modals full-screen on mobile */
        [data-popup] {
          left: 0 !important; top: 0 !important;
          width: 100vw !important; height: 100vh !important;
          border-radius: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
